# P25T fuzzel config (launcher, Super+d) - repo: config/fuzzel/fuzzel.ini
# Installed as ~/.config/fuzzel/fuzzel.ini by tools/install_user_config.sh.

[main]
# Same font as foot. dpi-aware=no: fuzzel otherwise scales the font by the
# panel's ~150 dpi and draws it huge (seen 2026-10-15).
font=Terminus:pixelsize=18
dpi-aware=no
# Programs that run in a terminal (micro, htop, ...) are opened in foot
terminal=foot -e
